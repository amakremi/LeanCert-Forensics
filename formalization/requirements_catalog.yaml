requirements:
  - requirement_id: REQ-ID-001
    name: IdentityCompleteness
    description: Required identifiers and descriptive identity fields are non-empty.
    scope: Trace, evidence, actors, events, and report claims.
    source_or_rationale: Internal assurance model; not a claim of legal sufficiency.
    python_check: check_identity
    lean_predicate: IdentityComplete
    lean_theorem: validTrace_implies_identity
    positive_test_ids: [TEST-ID-POS-001]
    negative_test_ids: [TEST-ID-NEG-001]
    benchmark_mutations: [DEV-001]
    failure_explanation_support: true
    status: formalized
    sub_obligations: [trace identity, evidence identity, actor identity, event identity, claim identity]
    known_exclusions: [Government-issued identity authentication is outside the model.]
  - requirement_id: REQ-REF-001
    name: ReferentialIntegrity
    description: Identifiers are unique and all internal references resolve.
    scope: Evidence, actors, events, claims, and parent relations.
    source_or_rationale: Internal relational consistency.
    python_check: check_references
    lean_predicate: ReferentiallyValid
    lean_theorem: validTrace_implies_referential_integrity
    positive_test_ids: [TEST-REF-POS-001]
    negative_test_ids: [TEST-REF-NEG-001]
    benchmark_mutations: [DEV-002, HOLDOUT-004, HOLDOUT-005]
    failure_explanation_support: true
    status: formalized
    sub_obligations: [unique identifiers, event evidence reference, event actor reference, claim support reference, derived parent reference]
    known_exclusions: [External database identifiers are outside the model.]
  - requirement_id: REQ-ART-001
    name: PublicArtifactIntegrity
    description: Locally registered bytes match declared hashes and sizes when available.
    scope: Local artifact anchoring.
    source_or_rationale: Reproducible local artifact binding.
    python_check: check_public_artifacts
    lean_predicate: ArtifactIntegrityValid
    lean_theorem: validTrace_implies_artifact_integrity
    positive_test_ids: [TEST-ART-POS-001]
    negative_test_ids: [TEST-ART-NEG-001]
    benchmark_mutations: [DEV-ART-LOCAL]
    failure_explanation_support: true
    status: formalized
    sub_obligations: [artifact availability, SHA-256 match, size match]
    known_exclusions: [Publisher authenticity is audited separately and is not proved in Lean.]
  - requirement_id: REQ-CUST-001
    name: CustodyContinuity
    description: Holder transitions link continuously for each evidence item.
    scope: Modeled digital custody events.
    source_or_rationale: Internal custody transition semantics.
    python_check: check_custody
    lean_predicate: CustodyContinuous
    lean_theorem: validTrace_implies_custody
    positive_test_ids: [TEST-CUST-POS-001]
    negative_test_ids: [TEST-CUST-NEG-001]
    benchmark_mutations: [HOLDOUT-001]
    failure_explanation_support: true
    status: formalized
    sub_obligations: [acquisition origin, previous-holder continuity, transfer assignee, preservation assignee]
    known_exclusions: [Physical seal authenticity and human identity authentication are outside the model.]
  - requirement_id: REQ-CHR-001
    name: ChronologicalConsistency
    description: Non-negative timestamps and modeled prerequisites precede reporting and derivation.
    scope: Timestamped event relations.
    source_or_rationale: Internal temporal ordering model.
    python_check: check_chronology
    lean_predicate: ChronologicallyConsistent
    lean_theorem: validTrace_implies_chronology
    positive_test_ids: [TEST-CHR-POS-001]
    negative_test_ids: [TEST-CHR-NEG-001]
    benchmark_mutations: [DEV-003]
    failure_explanation_support: true
    status: formalized
    sub_obligations: [non-negative and sequence-monotone timestamps, report prerequisites, parent-before-derivative]
    known_exclusions: [Clock synchronization accuracy is outside the model.]
  - requirement_id: REQ-HASH-001
    name: HashContinuity
    description: Acquisition starts at genesis and adjacent events preserve declared hash links.
    scope: Modeled cryptographic link fields.
    source_or_rationale: Internal hash-chain consistency.
    python_check: check_hashes
    lean_predicate: HashContinuous
    lean_theorem: validTrace_implies_hash_continuity
    positive_test_ids: [TEST-HASH-POS-001]
    negative_test_ids: [TEST-HASH-NEG-001]
    benchmark_mutations: [HOLDOUT-002, HOLDOUT-006]
    failure_explanation_support: true
    status: formalized
    sub_obligations: [genesis link, adjacent link, unauthorized hash change, derivative parent]
    known_exclusions: [Cryptographic algorithm collision resistance is assumed, not proved.]
  - requirement_id: REQ-AUTH-001
    name: AuthorizedHandling
    description: Actor roles are permitted to perform their declared actions.
    scope: Closed role-action authorization matrix.
    source_or_rationale: Prototype policy matrix.
    python_check: check_authorization
    lean_predicate: AuthorizedHandling
    lean_theorem: validTrace_implies_authorization
    positive_test_ids: [TEST-AUTH-POS-001]
    negative_test_ids: [TEST-AUTH-NEG-001]
    benchmark_mutations: [HOLDOUT-003]
    failure_explanation_support: true
    status: formalized
    sub_obligations: [role resolution, role-action permission]
    known_exclusions: [Organization-specific delegation and emergency overrides are outside the model.]
  - requirement_id: REQ-LIFE-001
    name: LifecycleCorrectness
    description: Modeled lifecycle prerequisites hold for acquisition, analysis, reporting, derivation, and archive.
    scope: Prototype forensic workflow.
    source_or_rationale: Declared workflow semantics.
    python_check: check_lifecycle
    lean_predicate: LifecycleCorrect
    lean_theorem: validTrace_implies_lifecycle
    positive_test_ids: [TEST-LIFE-POS-001]
    negative_test_ids: [TEST-LIFE-NEG-001]
    benchmark_mutations: [DEV-003]
    failure_explanation_support: true
    status: formalized
    sub_obligations: [preservation and transfer after acquisition, examination and analysis after preservation or derivation, reporting after required analysis or examination, archive after report, derivative parent readiness]
    known_exclusions: [Jurisdiction-specific workflow rules are outside the model.]
  - requirement_id: REQ-RPT-001
    name: ReportTraceability
    description: Claims identify existing supporting evidence that passed upstream checks.
    scope: Modeled report claims.
    source_or_rationale: Internal claim-support dependency.
    python_check: check_report_traceability
    lean_predicate: ReportTraceable
    lean_theorem: validTrace_implies_report_traceability
    positive_test_ids: [TEST-RPT-POS-001]
    negative_test_ids: [TEST-RPT-NEG-001]
    benchmark_mutations: [HOLDOUT-004]
    failure_explanation_support: true
    status: formalized
    sub_obligations: [claim text, support presence, support resolution, upstream support validity]
    known_exclusions: [Scientific truth of a supported claim is not established.]
python_only_properties:
  - Local filesystem readability and byte-level artifact hash recomputation.
lean_only_properties:
  - Generated artifact well-formedness is distinguished from trace acceptance.
